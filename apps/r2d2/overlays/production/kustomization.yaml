apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: r2d2
patches:
  - target:
      kind: Deployment
      name: r2d2-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
  # Keep the existing ClusterIP for the Nginx upstream
  - target:
      kind: Service
      name: r2d2-api
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.179.41
images:
  - name: ghcr.io/fedal-nl/fedal-r2d2
    newTag: latest