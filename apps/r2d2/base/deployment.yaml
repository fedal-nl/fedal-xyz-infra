apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2d2-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: r2d2-api
  template:
    metadata:
      labels:
        app: r2d2-api
    spec:
      containers:
        - name: r2d2-api
          image: ghcr.io/fedal/r2d2-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: r2d2-env
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failedThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi