apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicentralhub-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aicentralhub-backend
  template:
    metadata:
      labels:
        app: aicentralhub-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: collectstatic
          image: ghcr.io/fedal-nl/aicentralhub-backend:0.2.5
          command:
            - sh
            - -c
            - uv run --no-sync python manage.py collectstatic --noinput
          envFrom:
            - secretRef:
                name: aicentralhub-backend-env
          env:
            - name: DB_HOST
              value: aicentralhub-postgres-rw
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles

      containers:
        - name: backend
          image: ghcr.io/fedal-nl/aicentralhub-backend:0.2.5
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - gunicorn
            - aicentralhub.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
            - --threads
            - "2"
            - --timeout
            - "30"

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: aicentralhub-backend-env

          env:
            - name: DB_HOST
              value: aicentralhub-postgres-rw
            - name: DB_PORT
              value: "5432"
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0

          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: uploads
              mountPath: /app/import_uploads

          readinessProbe:
            httpGet:
              path: /live/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /live/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: aicentralhub-uploads