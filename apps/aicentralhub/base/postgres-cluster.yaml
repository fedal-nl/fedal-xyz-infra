apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aicentralhub-postgres

spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  bootstrap:
    initdb:
      database: neondb
      owner: neondb_owner
      secret:
        name: aicentralhub-postgres-app
      encoding: UTF8

  storage:
    storageClass: local-path
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
