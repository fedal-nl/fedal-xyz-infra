apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicentralhub-celery-beat
spec:
  replicas: 0
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: aicentralhub-celery-beat

  template:
    metadata:
      labels:
        app: aicentralhub-celery-beat

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: celery-beat
          image: ghcr.io/fedal-nl/aicentralhub-backend:v0.2.5
          imagePullPolicy: IfNotPresent

          command:
            - uv
            - run
            - --no-sync
            - celery
            - -A
            - aicentralhub
            - beat
            - --loglevel=info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler

          envFrom:
            - secretRef:
                name: aicentralhub-backend-env

          env:
            - name: DB_HOST
              value: aicentralhub-postgres-rw
            - name: DB_PORT
              value: "5432"
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL