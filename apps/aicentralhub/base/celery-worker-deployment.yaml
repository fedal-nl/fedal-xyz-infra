apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicentralhub-celery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aicentralhub-celery
  template:
    metadata:
      labels:
        app: aicentralhub-celery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: celery
          image: ghcr.io/fedal-nl/aicentralhub-backend:v0.2.5
          imagePullPolicy: IfNotPresent

          command:
            - uv
            - run
            - --no-sync
            - celery
            - -A
            - aicentralhub
            - worker
            - --loglevel=info

          envFrom:
            - secretRef:
                name: aicentralhub-backend-env

          env:
            - name: DB_HOST
              value: aicentralhub-postgres-rw
            - name: DB_PORT
              value: "5432"
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0

          volumeMounts:
            - name: uploads
              mountPath: /app/import_uploads

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: aicentralhub-uploads